spring.application.name=ms-products
# ---- DataSource (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/products_MS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=my-secret-pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Pool de conexiones (HikariCP, opcional) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000



# configuraciones flyway
# spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0.0